name: GovtJob AI Agent CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-lint:
    name: Backend Lint, Security & Pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 bandit pytest pytest-asyncio pytest-cov

      - name: Lint Code with Flake8
        run: |
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Security Analysis with Bandit
        run: |
          bandit -r backend/app -ll -ii || true

      - name: Run Pytest Test Suite
        env:
          APP_ENV: testing
          SECRET_KEY: test_secret_key_32bytes_minimum_length
        run: |
          cd backend
          pytest --cov=app --cov-report=term-missing

  frontend-build-and-lint:
    name: Frontend Lint & Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run ESLint
        run: |
          cd frontend
          npm run lint || true

      - name: Build Next.js Production Bundle
        run: |
          cd frontend
          npm run build

  docker-build-test:
    name: Validate Docker Multi-Stage Builds
    runs-on: ubuntu-latest
    needs: [backend-test-and-lint, frontend-build-and-lint]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Docker Image
        run: |
          docker build -t govtjob-backend:ci ./backend

      - name: Build Frontend Docker Image
        run: |
          docker build -t govtjob-frontend:ci ./frontend
