[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govtjob-ai-agent-backend"
version = "1.0.0"
description = "Production-grade AI Government Job Automation Backend"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "GovtJob Technical Core", email = "engineering@govtjob-agent.ai" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.0",
    "apscheduler>=3.10.4",
    "playwright>=1.42.0",
    "openai>=1.14.0",
    "python-telegram-bot>=21.0.0",
    "httpx>=0.27.0"
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests"
]
pythonpath = [
    "."
]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100
